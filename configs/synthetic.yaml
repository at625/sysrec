# Tiny synthetic config used by tests and CI.
seed: 0
data:
  raw_dir: data/synthetic/raw
  processed_dir: data/synthetic/processed
  positive_threshold: 4.0
  val_start: 1600000000
  test_start: 1610000000
  test_end: 1620000000
  user_fraction: 1.0
artifacts_dir: data/synthetic/artifacts
results_dir: data/synthetic/results

baselines:
  recent_days_grid: [30, 365]
  als_grid:
    - {factors: 8, regularization: 0.05, alpha: 10.0}
  als_iterations: 5
  select_metric: recall@100

two_tower:
  epochs: 3
  batch_size: 128
  lr: 0.003
  log_every: 0
  model: {dim: 16, id_dim: 16, hidden: 32, history_len: 10, temperature: 0.1}
  ablations:
    no_logq: {logq: false}
    mixed_negatives: {uniform_negatives: 64}

ranking:
  candidates: 50
  label_days: 60
  max_train_users: 1000
  lgbm: {num_rounds: 30, learning_rate: 0.1, num_leaves: 7, min_data_in_leaf: 5}
  dcn: {epochs: 2, batch_size: 256, lr: 0.003, n_cross: 2, hidden: [32], dropout: 0.0}
  rating_weight_grid: [0.0, 0.2]
  ablation_groups:
    retrieval: [retrieval_score, retrieval_rank, als_score]
