# Tiny synthetic config used by tests and CI.
seed: 0
data:
  raw_dir: data/synthetic/raw
  processed_dir: data/synthetic/processed
  positive_threshold: 4.0
  val_start: 1600000000
  test_start: 1610000000
  test_end: 1620000000
  user_fraction: 1.0
artifacts_dir: data/synthetic/artifacts
results_dir: data/synthetic/results

baselines:
  recent_days_grid: [30, 365]
  als_grid:
    - {factors: 8, regularization: 0.05, alpha: 10.0}
  als_iterations: 5
  select_metric: recall@100
